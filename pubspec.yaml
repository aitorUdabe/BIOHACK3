name: anti_gravity
description: Anti-Gravity mobile MVP for circadian biohacking and adaptive nutrition.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  intl: ^0.20.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  workmanager: ^0.5.2
  sentry_flutter: ^8.9.0
  supabase_flutter: ^2.8.0
  purchases_flutter: ^8.2.0
  posthog_flutter: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
